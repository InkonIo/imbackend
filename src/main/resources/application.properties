spring.application.name=im
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iminside_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.seed.admin-login=${ADMIN_LOGIN:}
app.seed.admin-password=${ADMIN_PASSWORD:}

app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-0123456789}
app.jwt.expiration-minutes=720

app.cors.origins=http://localhost:5173,http://127.0.0.1:5173

app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


app.telegram.token=${TELEGRAM_BOT_TOKEN:}
# слать ли суперадминам всё, что получают директора
app.telegram.notify-admins=${TELEGRAM_NOTIFY_ADMINS:true}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=framework